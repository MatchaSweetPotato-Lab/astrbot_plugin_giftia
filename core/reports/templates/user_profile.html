<html lang="zh-CN">
<head>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 44px; background: #edf4f1; color: #183c32; font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
.report { background: #fff; border: 1px solid #d9e7e0; border-radius: 28px; padding: 42px; }
.eyebrow { color: #49806a; font-size: 18px; letter-spacing: 3px; }
h1 { margin: 18px 0 10px; font-size: 44px; }
.subtitle, footer { color: #72867d; font-size: 18px; line-height: 1.7; }
.relationship { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0; }
.metric { padding: 22px; background: #f1f8f4; border-radius: 18px; }
.metric span { display: block; color: #49806a; font-size: 18px; margin-bottom: 10px; }
.metric strong { font-size: 28px; }
.field { padding: 22px 0; border-bottom: 1px solid #e6eee9; }
.field h2 { margin: 0 0 10px; color: #49806a; font-size: 20px; font-weight: 500; }
.field p { margin: 0; font-size: 23px; line-height: 1.65; white-space: pre-wrap; }
.report * { min-width: 0; overflow-wrap: anywhere; }
footer { margin-top: 28px; }
@media (max-width: 600px) { body { padding: 20px; } .report { padding: 26px; } .relationship { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="report">
  <div class="eyebrow">GIFTIA · PROFILE</div>
  <h1>{{ title }}</h1>
  <div class="subtitle">用户 ID · {{ user_id }}<br>机器人 · {{ nickname }} ({{ bot_name }})</div>
  <section class="relationship">
    <div class="metric"><span>好感度</span><strong>{{ relation }}</strong></div>
    <div class="metric"><span>关系称谓</span><strong>{{ relation_title }}</strong></div>
  </section>
  {% for label, value in profile_fields.items() %}
  <section class="field"><h2>{{ label }}</h2><p>{{ value }}</p></section>
  {% endfor %}
  <footer>会话 {{ session_id }} · {{ generated_at }}</footer>
</main>
</body>
</html>
